<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="zero-touch-second-brain: capture, distill, retrieve, triage, verify">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <text x="60" y="105" font-family="Inter,DejaVu Sans,sans-serif" font-size="52" font-weight="700" fill="#f8fafc">zero-touch-second-brain</text>
  <text x="60" y="150" font-family="Inter,DejaVu Sans,sans-serif" font-size="23" fill="#94a3b8">Your agent files the session itself. Plain Markdown you own.</text>

  <g font-family="Inter,DejaVu Sans,sans-serif" font-size="17" text-anchor="middle">
    <g>
      <rect x="60" y="215" width="190" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="155" y="248" fill="#5eead4" font-weight="600">Capture</text>
      <text x="155" y="274" fill="#cbd5e1" font-size="14">clipboard + session</text>
    </g>
    <g>
      <rect x="310" y="215" width="190" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="405" y="248" fill="#5eead4" font-weight="600">Distill</text>
      <text x="405" y="274" fill="#cbd5e1" font-size="14">5 atomic lessons</text>
    </g>
    <g>
      <rect x="560" y="215" width="190" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="655" y="248" fill="#60a5fa" font-weight="600">Retrieve</text>
      <text x="655" y="274" fill="#cbd5e1" font-size="14">top rules first</text>
    </g>
    <g>
      <rect x="810" y="215" width="190" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="905" y="248" fill="#60a5fa" font-weight="600">Triage</text>
      <text x="905" y="274" fill="#cbd5e1" font-size="14">inbox + manifest</text>
    </g>
    <g>
      <rect x="1010" y="215" width="130" height="76" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="1075" y="248" fill="#a78bfa" font-weight="600">Verify</text>
      <text x="1075" y="274" fill="#cbd5e1" font-size="14">health</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M250 253 H305"/><path d="M500 253 H555"/><path d="M750 253 H805"/><path d="M1000 253 H1005"/>
  </g>
  <text x="60" y="345" font-family="Inter,DejaVu Sans,sans-serif" font-size="16" fill="#64748b">OpenCode-first · no database · no cloud · MIT licensed</text>
