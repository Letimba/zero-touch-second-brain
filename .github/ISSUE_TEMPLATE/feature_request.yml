name: Feature request
description: A focused improvement with a measurable outcome
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: "What is slow, missing or wrong today?"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: "Smallest change that would fix it"}
    validations: {required: true}
  - type: textarea
    id: measure
    attributes: {label: How to measure success, placeholder: "e.g. queue drains to 0 within 30 min"}
    validations: {required: true}
