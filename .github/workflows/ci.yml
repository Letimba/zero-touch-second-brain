name: release-hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release hygiene
        run: bash scripts/verify.sh
      - name: Smoke tests
        run: python3 -m unittest discover -s tests -v
